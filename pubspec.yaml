name: yolo_tracker_app
description: "Счетчик изделий ЦЕХ №8"

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  ultralytics_yolo: ^0.6.13
  camera: ^0.11.0
  image: ^4.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.0
  shared_preferences: ^2.2.3
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/rezec_road_2210_640px.tflite
    - assets/logo.png

dependency_overrides:
  camera_android_camerax: ^0.7.4+6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21