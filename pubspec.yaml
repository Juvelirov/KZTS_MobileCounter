name: yolo_tracker_app
description: "Счетчик изделий ЦЕХ №8"

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Плагин Ultralytics YOLO для распознавания
  ultralytics_yolo: ^0.6.13
  # Камера и работа с изображениями
  camera: ^0.11.0
  image: ^4.1.0
  # Разрешения и пути к файлам
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  # Блокировка экрана во время работы
  wakelock_plus: ^1.8.0
  # Локальное хранилище для истории и настроек (ОБЯЗАТЕЛЬНО для работы)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/new_weights_32.tflite
    - assets/models/rezec_road_2210_640px.tflite
    - assets/logo.png

dependency_overrides:
  camera_android_camerax: ^0.7.4+6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

